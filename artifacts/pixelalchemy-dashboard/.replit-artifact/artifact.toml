kind = "web"
previewPath = "/"
title = "PixelAlchemy Risk Dashboard"
description = "A disaster-management decision dashboard for assessing village hazard exposure, prioritizing relocation needs, and ranking capacity-verified safe sites across Uttarakhand."
version = "1.0.0"
id = "artifacts/pixelalchemy-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24633

[services.development]
run = "pnpm --filter @workspace/pixelalchemy-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/pixelalchemy-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/pixelalchemy-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24633"
BASE_PATH = "/"
